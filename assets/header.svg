<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">MD Obaidullah Al-Faruk</title>
  <desc id="desc">Cloud and Backend Engineer - design, build, and deploy</desc>

  <style>
    .grid-drift { animation: grid-drift 16s linear infinite; }
    .glow-cyan { animation: glow-cyan 7s ease-in-out infinite alternate; }
    .glow-purple { animation: glow-purple 8s ease-in-out infinite alternate; }
    .pipeline-node { animation: node-pulse 3.6s ease-in-out infinite; }
    .build-node { animation-delay: 1.2s; }
    .deploy-node { animation-delay: 2.4s; }
    .status-dot { animation: status-pulse 1.8s ease-in-out infinite; }
    .flow-line { animation: dash-flow 1.4s linear infinite; }
    .aurora-one { animation: aurora-one 11s ease-in-out infinite alternate; }
    .aurora-two { animation: aurora-two 13s ease-in-out infinite alternate; }
    .network-line { animation: network-flow 8s linear infinite; }
    .ambient-wave { animation: ambient-flow 10s linear infinite; }
    .particle { animation: particle-float 5s ease-in-out infinite; }
    .particle-two { animation-delay: -1.4s; }
    .particle-three { animation-delay: -2.8s; }
    .particle-four { animation-delay: -4.1s; }
    .twinkle { animation: twinkle 3.2s ease-in-out infinite; }
    .twinkle-two { animation-delay: -1.1s; }
    .twinkle-three { animation-delay: -2.2s; }

    @keyframes grid-drift {
      from { transform: translateX(0); }
      to { transform: translateX(32px); }
    }
    @keyframes glow-cyan {
      from { opacity: 0.45; transform: translate(-18px, 8px) scale(0.96); }
      to { opacity: 0.9; transform: translate(16px, -8px) scale(1.05); }
    }
    @keyframes glow-purple {
      from { opacity: 0.42; transform: translate(14px, -6px) scale(1.04); }
      to { opacity: 0.85; transform: translate(-16px, 10px) scale(0.96); }
    }
    @keyframes node-pulse {
      0%, 70%, 100% { stroke-opacity: 0.55; }
      35% { stroke-opacity: 1; }
    }
    @keyframes status-pulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }
    @keyframes dash-flow {
      to { stroke-dashoffset: -18; }
    }
    @keyframes aurora-one {
      from { opacity: 0.3; transform: translate(-34px, 14px); }
      to { opacity: 0.65; transform: translate(32px, -12px); }
    }
    @keyframes aurora-two {
      from { opacity: 0.24; transform: translate(28px, -10px); }
      to { opacity: 0.58; transform: translate(-30px, 14px); }
    }
    @keyframes network-flow {
      to { stroke-dashoffset: -56; }
    }
    @keyframes ambient-flow {
      to { stroke-dashoffset: -120; }
    }
    @keyframes particle-float {
      0%, 100% { transform: translateY(0); opacity: 0.35; }
      50% { transform: translateY(-13px); opacity: 0.9; }
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.18; }
      50% { opacity: 0.85; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <defs>
    <linearGradient id="background" x1="40" y1="20" x2="1160" y2="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071426" />
      <stop offset="0.5" stop-color="#0D1117" />
      <stop offset="1" stop-color="#17102E" />
    </linearGradient>
    <linearGradient id="accent" x1="90" y1="60" x2="1110" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE" />
      <stop offset="1" stop-color="#A78BFA" />
    </linearGradient>
    <linearGradient id="auroraCyan" x1="30" y1="300" x2="900" y2="70" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06B6D4" stop-opacity="0" />
      <stop offset="0.45" stop-color="#22D3EE" stop-opacity="0.34" />
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="auroraPurple" x1="390" y1="390" x2="1180" y2="50" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6" stop-opacity="0" />
      <stop offset="0.55" stop-color="#A78BFA" stop-opacity="0.3" />
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="cyanGlow" cx="0" cy="0" r="1" gradientTransform="translate(180 200) rotate(15) scale(360 260)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0891B2" stop-opacity="0.34" />
      <stop offset="1" stop-color="#0891B2" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="purpleGlow" cx="0" cy="0" r="1" gradientTransform="translate(1040 180) rotate(160) scale(350 260)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C3AED" stop-opacity="0.32" />
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#94A3B8" stroke-opacity="0.065" />
    </pattern>
    <clipPath id="canvasClip">
      <rect width="1200" height="400" rx="28" />
    </clipPath>
  </defs>

  <rect width="1200" height="400" rx="28" fill="url(#background)" />

  <g clip-path="url(#canvasClip)">
    <rect class="grid-drift" x="-32" width="1264" height="400" fill="url(#grid)" />
    <rect class="glow-cyan" width="1200" height="400" fill="url(#cyanGlow)" />
    <rect class="glow-purple" width="1200" height="400" fill="url(#purpleGlow)" />

    <path class="aurora-one" d="M-110 316C96 174 246 350 448 218C666 76 842 174 1044 54C1150 -10 1268 8 1334 82L1334 188C1160 108 1022 268 842 258C650 246 564 324 398 352C196 386 28 334 -110 402Z" fill="url(#auroraCyan)" />
    <path class="aurora-two" d="M288 420C430 254 558 312 704 190C876 46 1024 82 1302 -44L1302 130C1112 160 1030 278 862 304C660 334 566 414 288 420Z" fill="url(#auroraPurple)" />

    <g opacity="0.34">
      <path class="network-line" d="M18 284C176 234 272 304 398 250C522 198 590 114 728 126" stroke="#22D3EE" stroke-width="1.2" stroke-dasharray="5 12" />
      <path class="network-line" d="M430 42C548 104 626 52 722 92C814 130 860 208 968 222C1058 234 1124 198 1218 212" stroke="#A78BFA" stroke-width="1.2" stroke-dasharray="5 12" />
      <path d="M544 366C656 288 748 342 846 286C946 228 1020 270 1182 174" stroke="url(#accent)" stroke-width="1" stroke-opacity="0.45" />
    </g>

    <g fill="#67E8F9">
      <circle class="particle" cx="366" cy="76" r="2.7" />
      <circle class="particle particle-two" cx="552" cy="318" r="2.2" />
      <circle class="particle particle-three" cx="688" cy="62" r="2.4" />
      <circle class="particle particle-four" cx="1160" cy="346" r="2.5" />
    </g>
    <g fill="#C4B5FD">
      <circle class="twinkle" cx="42" cy="158" r="1.8" />
      <circle class="twinkle twinkle-two" cx="326" cy="342" r="1.6" />
      <circle class="twinkle twinkle-three" cx="654" cy="238" r="1.8" />
      <circle class="twinkle" cx="1128" cy="44" r="1.6" />
      <circle class="twinkle twinkle-two" cx="1180" cy="252" r="1.4" />
    </g>

    <path class="ambient-wave" d="M-38 352C174 310 338 390 526 346C716 300 870 350 1038 308C1116 288 1184 276 1246 290" stroke="url(#accent)" stroke-width="1.4" stroke-opacity="0.25" stroke-dasharray="34 16" />
  </g>

  <g opacity="0.9">
    <path d="M86 86H222" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" />
    <circle cx="76" cy="86" r="5" fill="#22D3EE" />
    <circle cx="232" cy="86" r="5" fill="#A78BFA" />
  </g>

  <text x="86" y="164" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="50" font-weight="750" letter-spacing="-1.4">MD Obaidullah Al-Faruk</text>
  <text x="86" y="215" fill="#CBD5E1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="500">Cloud &amp; Backend Engineer</text>
  <text x="86" y="264" fill="url(#accent)" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="650" letter-spacing="0.4">AWS  •  PYTHON  •  DEVOPS  •  MLOPS</text>

  <g transform="translate(86 304)">
    <rect width="242" height="42" rx="21" fill="#0F2634" stroke="#155E75" />
    <circle class="status-dot" cx="24" cy="21" r="6" fill="#34D399" />
    <text x="42" y="27" fill="#D1FAE5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="550">Dhaka, Bangladesh</text>
  </g>

  <g>
    <rect x="744" y="72" width="390" height="256" rx="24" fill="#0D1726" fill-opacity="0.78" stroke="#334155" />
    <text x="780" y="114" fill="#94A3B8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="650" letter-spacing="1.8">SYSTEM DELIVERY</text>

    <path class="flow-line" d="M792 146H1082" stroke="url(#accent)" stroke-width="2" stroke-dasharray="8 10" />
    <circle cx="792" cy="146" r="7" fill="#22D3EE">
      <animate attributeName="cx" values="792;1082;792" dur="4s" repeatCount="indefinite" />
    </circle>

    <g class="pipeline-node">
      <rect x="774" y="176" width="92" height="54" rx="13" fill="#071426" stroke="#22D3EE" stroke-width="1.5" />
      <text x="820" y="208" text-anchor="middle" fill="#A5F3FC" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700">DESIGN</text>
    </g>
    <path d="M871 203H889M883 197L889 203L883 209" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

    <g class="pipeline-node build-node">
      <rect x="895" y="176" width="92" height="54" rx="13" fill="#0B1B29" stroke="#38BDF8" stroke-width="1.5" />
      <text x="941" y="208" text-anchor="middle" fill="#BAE6FD" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700">BUILD</text>
    </g>
    <path d="M992 203H1010M1004 197L1010 203L1004 209" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

    <g class="pipeline-node deploy-node">
      <rect x="1016" y="176" width="92" height="54" rx="13" fill="#15102A" stroke="#A78BFA" stroke-width="1.5" />
      <text x="1062" y="208" text-anchor="middle" fill="#DDD6FE" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700">DEPLOY</text>
    </g>

    <rect x="774" y="256" width="334" height="44" rx="12" fill="#0F172A" stroke="#334155" />
    <circle class="status-dot" cx="798" cy="278" r="6" fill="#34D399" />
    <text x="817" y="284" fill="#CBD5E1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">observe  •  learn  •  improve</text>
  </g>

  <path d="M28 372C245 344 438 397 650 365C846 336 1008 377 1172 345" stroke="url(#accent)" stroke-width="2" stroke-opacity="0.42" />
  <rect x="1" y="1" width="1198" height="398" rx="27" stroke="url(#accent)" stroke-opacity="0.3" stroke-width="2" />
</svg>
